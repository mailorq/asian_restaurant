# production SPA host: serves the Vite build and reverse proxies the backend
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed vite assets are immutable - cache them hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # User-uploaded product images from the shared media volume
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # backend: api, django admin, and django served static (admin assets via whitenoise)
    location /api/    { proxy_pass http://backend:8000; include /etc/nginx/proxy_params.conf; }
    location /admin/  { proxy_pass http://backend:8000; include /etc/nginx/proxy_params.conf; }
    location /static/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params.conf; }

    # /metrics is deliberately nit proxied. prometheus scrapes backend:8000 directly

    # SPA fallback - every other path resolves to the app shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
