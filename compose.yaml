name: asian-restaurant

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./ops/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./ops/rabbitmq/definitions.dev.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    # management UI bound to localhost only — do not expose the broker publicly
    ports:
      - "127.0.0.1:15672:15672"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    env_file: [.env]
    environment:
      PROMETHEUS_MULTIPROC_DIR: /app/.prometheus
      IDENTITY_JWT_PRIVATE_KEY_FILE: /run/identity/jwt_private_key.pem
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - media:/app/media
      # local dev signing key (gitignored; run scripts/dev_gen_jwt_key.sh once);
      # production injects its own key via a secret and drops this mount (compose.prod.yaml)
      - ./ops/identity/jwt_private_key.pem:/run/identity/jwt_private_key.pem:ro
    expose:
      - "8000"          # internal only; reached over the compose network
    restart: unless-stopped

  # transactional outbox relay: publishes pending order events to RabbitMQ
  relay:
    build:
      context: ./backend
      target: prod
    env_file: [.env]
    command: python manage.py publish_outbox --loop
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # ops runtime: consumes order events and builds the RestaurantOrder projection
  ops:
    build:
      context: ./backend
      target: prod
    env_file: [.env]
    command: python manage.py run_ops_consumer
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # --- independent operations service (own DB, own credentials) ---
  operations-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${OPERATIONS_DB_NAME:-operations}
      POSTGRES_USER: ${OPERATIONS_DB_USER:-ops_user}
      POSTGRES_PASSWORD: ${OPERATIONS_DB_PASSWORD:-ops_pass}
    volumes:
      - operations_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  operations-api:
    build:
      context: .
      dockerfile: services/order_operations/Dockerfile
      target: prod
    environment:
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:-ops-dev-insecure}
      OPERATIONS_DATABASE_URL: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@operations-db:5432/${OPERATIONS_DB_NAME:-operations}
      OPERATIONS_RABBITMQ_URL: ${OPERATIONS_RABBITMQ_URL}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://backend:8000/api/auth/jwks}
    depends_on:
      operations-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "9000"
    restart: unless-stopped

  operations-consumer:
    build:
      context: .
      dockerfile: services/order_operations/Dockerfile
      target: prod
    command: python manage.py run_operations_consumer
    environment:
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:-ops-dev-insecure}
      OPERATIONS_DATABASE_URL: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@operations-db:5432/${OPERATIONS_DB_NAME:-operations}
      OPERATIONS_RABBITMQ_URL: ${OPERATIONS_RABBITMQ_URL}
      OPERATIONS_METRICS_PORT: "9101"
    expose:
      - "9101"
    depends_on:
      operations-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      operations-api:
        condition: service_started
    restart: unless-stopped

  operations-bridge:
    build:
      context: .
      dockerfile: services/order_operations/Dockerfile
      target: prod
    command: python manage.py bridge_storefront_events
    environment:
      OPERATIONS_SECRET_KEY: ${OPERATIONS_SECRET_KEY:-ops-dev-insecure}
      OPERATIONS_DATABASE_URL: postgres://${OPERATIONS_DB_USER:-ops_user}:${OPERATIONS_DB_PASSWORD:-ops_pass}@operations-db:5432/${OPERATIONS_DB_NAME:-operations}
      OPERATIONS_BRIDGE_CONSUME_URL: ${OPERATIONS_BRIDGE_CONSUME_URL}
      OPERATIONS_BRIDGE_PUBLISH_URL: ${OPERATIONS_BRIDGE_PUBLISH_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      operations-consumer:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    depends_on:
      - backend
    volumes:
      - media:/media:ro
    ports:
      - "80:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  media:
  promdata:
  rabbitmqdata:
  redis_data:
  operations_pgdata:
