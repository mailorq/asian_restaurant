global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    project: asian-restaurant

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: operations-api
    static_configs:
      - targets: ["operations-api:9105"]

  - job_name: operations-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["operations-consumer:9101"]

  - job_name: relay
    metrics_path: /metrics
    static_configs:
      - targets: ["relay:9104"]

  - job_name: commands-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["commands-consumer:9102"]

  - job_name: commands-relay
    metrics_path: /metrics
    static_configs:
      - targets: ["commands-relay:9103"]

  - job_name: rabbitmq
    # per-object endpoint exposes rabbitmq_queue_messages per queue (DLQ/retry depth)
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
