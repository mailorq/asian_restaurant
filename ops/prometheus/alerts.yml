groups:
  - name: operations
    rules:
      - alert: OperationsConsumerDown
        expr: operations_consumer_connected == 0 or absent(operations_consumer_connected)
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "operations consumer not connected to RabbitMQ"
          description: "operations_consumer_connected is 0/absent — the projection consumer is not consuming."

      - alert: OperationsDLQNotEmpty
        expr: rabbitmq_queue_messages{queue=~"operations.*dlq"} > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "poison events in an operations DLQ ({{ $labels.queue }})"
          description: "{{ $value }} message(s) in {{ $labels.queue }} — investigate rejected events."

      - alert: CommandDLQNotEmpty
        # the command queues live on the storefront vhost and do not match operations.*
        expr: rabbitmq_queue_messages{queue=~"commands[.].*dlq"} > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "poison commands in {{ $labels.queue }}"
          description: "{{ $value }} message(s) in {{ $labels.queue }}, order transitions are not being applied."

      - alert: CommandConsumerDown
        expr: commands_consumer_connected == 0 or absent(commands_consumer_connected)
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "command consumer not consuming"
          description: "no process is applying transition commands, so every command will time out."

      - alert: CommandOutboxBacklogStale
        # a command outlives its own deadline in 30s, so a backlog older than that is already producing timed_out commands rather than applied ones
        expr: operations_command_outbox_oldest_pending_age_seconds > 60
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "commands are not leaving the operations outbox"
          description: "oldest pending command is {{ $value }}s old; the relay or the storefront topology is down."

      - alert: OperationsRetryQueueGrowing
        expr: rabbitmq_queue_messages{queue=~"operations.*retry"} > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "operations retry queue backing up ({{ $labels.queue }})"
          description: "{{ $value }} message(s) stuck in retry — a downstream dependency may be failing."

      - alert: OperationsConflictEvents
        # any conflict is a real fault (two events at one version) — separate from stale
        expr: increase(operations_projection_events_total{outcome="conflict"}[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "operations projection saw a version conflict"
          description: "Two distinct events claimed the same aggregate version — producer version drift."

      - alert: OperationsStaleEventsElevated
        # a single benign replay is one stale event; alert only on a sustained rate
        expr: increase(operations_projection_events_total{outcome="stale"}[15m]) > 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "elevated stale event rate in operations projection"
          description: "More than 5 stale events in 15m sustained — likely reordered or duplicated delivery."
