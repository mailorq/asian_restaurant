name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asian
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asian_restaurant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-key
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://asian:postgres@localhost:5432/asian_restaurant
      REDIS_URL: redis://localhost:6379/1
      CART_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: pytest

  security-config:
    # runs from the repo root (no working-directory), so scripts resolve compose files
    # and git paths correctly; ubuntu-latest ships Docker Compose v2 for the config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose version
      - run: bash scripts/check_no_secrets.sh
      - run: bash scripts/check_prod_config.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
