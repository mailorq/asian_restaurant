[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-contracts"
version = "0.1.0"
description = "Versioned event/command contracts shared across services (no Django, no ORM)."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools]
packages = ["event_contracts"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "EXE002"]
